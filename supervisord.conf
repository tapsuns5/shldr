[supervisord]
nodaemon=true
user=nextjs
logfile=/dev/null
logfile_maxbytes=0

stopwaitsecs=20

[program:database-setup]
directory=/app
command=/bin/sh -c "echo 'Running database migrations...' && npx drizzle-kit migrate --verbose && echo 'Database setup completed successfully' && touch /tmp/db-ready"
autostart=true
autorestart=false
startsecs=0
startretries=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:gmail-worker]
command=/bin/sh -c "echo '[gmail-worker] Waiting for database setup...' && until [ -f /tmp/db-ready ]; do sleep 1; done && echo '[gmail-worker] Database ready, starting worker...' && npx tsx scripts/gmail-worker.ts"
directory=/app
autostart=true
autorestart=true
startsecs=3
startretries=3
stopwaitsecs=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=NODE_ENV=production

[program:nextjs]
command=/bin/sh -c "echo '[Next.js] Waiting for database setup...' && until [ -f /tmp/db-ready ]; do sleep 1; done && echo '[Next.js] Database ready, starting server...' && node server.js"
directory=/app
autostart=true
autorestart=true
startsecs=3
startretries=3
stopwaitsecs=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=NODE_ENV=production,PORT=3000,HOSTNAME=0.0.0.0
